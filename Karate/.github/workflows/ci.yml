name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karate
          POSTGRES_PASSWORD: karate_dev_password
          POSTGRES_DB: karate_dev
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U karate -d karate_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://karate:karate_dev_password@localhost:5433/karate_test?schema=public
      JWT_ACCESS_SECRET: test-only-access-secret-not-for-production-use-1234567890
      JWT_REFRESH_SECRET: test-only-refresh-secret-not-for-production-use-0987654321
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      LOG_LEVEL: silent
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create test database
        run: |
          PGPASSWORD=karate_dev_password psql -h localhost -p 5433 -U karate -d karate_dev -c 'CREATE DATABASE karate_test;' || true
      - run: pnpm --filter @karate/database run validate
      - run: pnpm --filter @karate/database run generate
      - run: pnpm --filter @karate/database run migrate:deploy
        env:
          DATABASE_URL: postgresql://karate:karate_dev_password@localhost:5433/karate_dev?schema=public
      - run: pnpm --filter @karate/database run migrate:deploy
        env:
          DATABASE_URL: postgresql://karate:karate_dev_password@localhost:5433/karate_test?schema=public
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
